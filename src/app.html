<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: without it env(safe-area-inset-*) is
		     always zero and the rail sits under the home indicator. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- The PWA shell (owner ruling 2026-08-26): installable from
		     the share sheet. No service worker - the pages stay no-JS. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<!-- Every navigation is a full page load (the pages ship no
		     JavaScript), so the fonts must win the race to first paint
		     on every page. Preloading pins them; without it the swap
		     from the fallback font is the flicker the owner saw. -->
		<link
			rel="preload"
			href="/fonts/playfair-display-600-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/playfair-display-600-italic-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/dm-sans-400-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/dm-sans-600-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/jetbrains-mono-400-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="page">%sveltekit.body%</div>
	</body>
</html>
