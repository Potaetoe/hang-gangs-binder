<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The same policy as the other member pages. This page has no key or
  plaintext, but it does hold the member session that authorizes its
  GET /charts-data read.

  crypto.js is deliberately not loaded. There is nothing here to
  decrypt, and a page that cannot decrypt cannot be talked into it.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://hgbinderworker.sorcererbiggz.workers.dev https://hgbinderworker-dev.sorcererbiggz.workers.dev https://hgbinderworker-sit.sorcererbiggz.workers.dev; base-uri 'none'; form-action 'none'">
<title>Charts — Hang Gang Binder</title>
<meta name="description" content="Aggregate submission numbers for signed-in members. No names, no individual entries.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#120d10">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="theme.css">
<script src="theme-init.js"></script>
</head>
<!-- Not `wide` any more - #71. These charts are read one at a time, and
     at 84rem this page's prose cards were the widest lines on the site.
     One centered column, like every other page. admin.html alone stays
     `wide`, carried from its pre-0.9-M3 shape rather than for anything
     the 0.9-M3-S10 rebuild (#416) added - see admin.html's own header. -->
<body class="railed">

<!--
  The rail, identical on every signed-in page. See the longer note in
  your-page.html for why it is written out rather than built, and what
  tools/check_web.py holds it to.
-->
<aside class="rail">
  <a class="wordmark" href="index.html">
    <span class="wordmark-owner">Hang Gang</span>
    <span class="wordmark-name">Binder</span>
  </a>

  <nav aria-label="Site">
    <ul class="rail-links">
      <li><a href="your-page.html">Your page</a></li>
      <li><a href="charts.html">Charts</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>

  <div class="rail-session">
    <p class="runner"><span>Session</span></p>
    <p class="rail-who" id="session-who">Not signed in</p>
    <a class="secondary rail-signin" id="sign-in" href="index.html">Sign in</a>
    <button type="button" class="secondary rail-signout" id="sign-out" hidden>
      Sign out
    </button>
  </div>
</aside>

<div class="page">

<header class="stack-tight">
  <p class="runner"><span>Members</span></p>
  <h1>Charts</h1>
  <!-- Ruled word for word (#275, from the register bar on #265) - this
       sentence is a privacy claim, not a Muse line, and 0.9-M2-S3
       leaves it exactly as the owner ruled it. tools/check_web.py's
       RULED_LINES pins the whole of it. -->
  <p class="muted" id="charts-intro">
    Counts and averages — no names, no individual entries.
  </p>
</header>

<main class="stack">

  <div class="card" data-dev-session hidden>
    <p class="caution">Development session</p>
    <p class="muted small">
      Signed in as <strong data-dev-identity></strong> through the local
      test sign-in — not a Telegram sign-in.
    </p>
  </div>

  <!--
    The control row: filter, measure, units, show-me, download - one
    card, one row, this order (0.9-M2-S3 design mandate 2). Filter and
    Measure are "what to ask"; Units is "how to see it"; Show-me and
    Download sit at the row's end. Nothing here fetches on its own - GET
    /charts-data fires only when Show-me is pressed.

    Picture LEFT THIS ROW at 0.9-M2-S15 (#383, owner ruling at the
    2026-08-20 sitting): there is nothing to choose a picture of until
    Show me has drawn one, so the toggle now lives in the results card
    beside the two figures it switches between - see that card's own
    comment, below.
  -->
  <div class="card">
    <div class="control-row">

      <!-- Filter: a two-step select. The field list and every value
           list come from apps/site.config.js (through fields.js) -
           never from a response. GET /charts-data deliberately never
           enumerates which values a group holds (the membership-oracle
           rule DESIGN.md's "The identifier is the whole problem" names),
           so this page must not try to rebuild that list from anything
           the server says. -->
      <div class="field">
        <label for="filter-field">Filter</label>
        <select id="filter-field">
          <option value="">Everyone</option>
        </select>
      </div>

      <div class="field" id="filter-value-field" hidden>
        <label for="filter-value">Value</label>
        <select id="filter-value"></select>
      </div>

      <!-- Measure: the chartable-measure list. There is no statistic
           picker any more - the trend line is always the mean and its
           label is "average" (DESIGN.md, "Charts"). -->
      <div class="field">
        <label for="measure">Measure</label>
        <select id="measure"></select>
      </div>

      <!-- Units. The route answers every system in one document; this
           picks which system's numbers to read off it rather than
           asking again or converting anything here (0.9-M2-S3 security
           mandate 2). -->
      <fieldset class="field">
        <legend>Units</legend>
        <div class="choices">
          <label class="choice">
            <input type="radio" name="units" value="imperial" checked>
            <span>Imperial</span>
          </label>
          <label class="choice">
            <input type="radio" name="units" value="metric">
            <span>Metric</span>
          </label>
        </div>
      </fieldset>

      <div class="control-row-actions">
        <button type="button" id="show-me" class="primary">Show me</button>
        <a id="download" class="secondary" download hidden>Download</a>
      </div>

    </div>
  </div>

  <!--
    Everything below stays hidden until a session, a response and
    something to draw all exist (0.9-M2-S3 design mandate 7). The
    status line is the one place every real state gets its own
    sentence - loading, not enough, or drawn - and it is also where the
    not-enough sentence renders: a plain paragraph inside this ordinary
    card, replacing the figure in place, with no icon, no red and no
    dismiss (mandate 4). It is content on a 200, styled no differently
    from any other state (security mandate 4).
  -->
  <div class="card" id="results" hidden>
    <!-- Picture toggle. Two views of one figure - the surviving
         legitimate use of the tab grammar (0.9-M2-S2 removes tabs as
         PAGE structure; this is not that). Both tabs are always
         available: categorical measures left the `measure` list
         entirely (owner ruling 1, #243), so every measure this page can
         chart has both a trend and a distribution - there is no
         categorical case left for the Trend tab to hide from.

         MOVED HERE FROM THE CONTROLS CARD, 0.9-M2-S15 (#383, owner
         ruling at the 2026-08-20 sitting): there is nothing to choose a
         picture of until Show me has actually drawn one, so the control
         now lives beside the pictures themselves rather than above them.
         `hidden` by default, matching every other row of this card - the
         same "hidden until there is something real" rule the figures and
         the status line already carry. apps/web/charts.js's
         renderAnswer() is the only thing that ever unhides it, and only
         on a drawn ("enough") answer; the not-enough branch hides it
         again, same as the figures. Placed ABOVE the status line: a
         member reads "here is how to look at what follows" before the
         sentence describing what follows, and the status line is the one
         paragraph aria-live="polite" announces on every draw, so nothing
         above it competes for that announcement.

         Same component, same ids, same click wiring in charts.js's
         setUp() - only the position and the show/hide moved. -->
    <fieldset class="field" id="picture-field" hidden>
      <legend>Picture</legend>
      <div role="tablist" aria-label="Picture">
        <button type="button" role="tab" id="picture-tab-trend"
          aria-controls="figure-trend" aria-selected="true">Trend</button>
        <button type="button" role="tab" id="picture-tab-distribution"
          aria-controls="figure-distribution"
          aria-selected="false">Distribution</button>
      </div>
    </fieldset>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div id="picture-trend" role="tabpanel" aria-labelledby="picture-tab-trend">
      <!--
        The tooltip (0.9-M2-S13, #378, owner ruling 2): a direct child of
        this figure so apps/web/charts.js's positionTooltip() can clamp
        it against the figure's own box (theme.css gives .chart
        position:relative for exactly this). Ships hidden and empty -
        charts.js is the only thing that ever writes its textContent,
        composed from the response's own numbers, never markup.
      -->
      <figure class="chart" id="figure-trend">
        <svg viewBox="0 0 640 280" role="img" aria-label="Trend over time"></svg>
        <div class="chart-tooltip" id="tooltip-trend" role="tooltip" hidden></div>
      </figure>
    </div>

    <div id="picture-distribution" role="tabpanel" hidden
      aria-labelledby="picture-tab-distribution">
      <figure class="chart" id="figure-distribution">
        <svg viewBox="0 0 640 320" role="img" aria-label="Distribution"></svg>
        <div class="chart-tooltip" id="tooltip-distribution" role="tooltip" hidden></div>
      </figure>
    </div>

    <!--
      The group makeup: plain count lines, no chart machinery (owner
      ruling 1 on #243 comment 5346978974). It carries its own <h2> - the
      real heading, not a .runner eyebrow (0.9-M2-S3's grammar: a runner
      names the section it stands on, it does not stand in for a
      heading) - because it is its own block on the page, not a caption
      on the two figures above it. apps/web/charts.js's renderGroups()
      fills it and hides it along with them for the one refusal state.
    -->
    <div id="groups" hidden>
      <h2>Group makeup</h2>
      <div id="groups-body" class="stack-tight"></div>
    </div>
  </div>

</main>

<footer>
  <!-- The four palettes as swatches, and the whole of what a footer
       holds on any page here - the owner's ruling on #274, which made
       every footer identical and gave navigation back to the rail. The
       longer note is in your-page.html's footer; the word may be ruled
       and the id may not, and nothing here is renamed on its own.

       Nobody is stranded by a footer with no way out of it. The rail
       is what carries navigation on this page, and the door back to
       sign-in is in the session block above - which is the surface
       that knows whether there is a session to end, and can therefore
       hide the door from somebody who has no use for it (#187). -->
  <div class="theme-swatches" role="group" aria-label="Color theme">
    <button type="button" data-set-theme="midnight" aria-label="Midnight"
      ><span class="swatch-dot" data-palette="midnight"></span></button>
    <button type="button" data-set-theme="pink" aria-label="Pink"
      ><span class="swatch-dot" data-palette="pink"></span></button>
    <button type="button" data-set-theme="daylight" aria-label="Daylight"
      ><span class="swatch-dot" data-palette="daylight"></span></button>
    <button type="button" data-set-theme="contrast" aria-label="Contrast"
      ><span class="swatch-dot" data-palette="contrast"></span></button>
  </div>
</footer>

</div>

<script src="config.js"></script>
<script src="site.config.js"></script>
<script src="fields.js"></script>
<script src="countries.js"></script>
<script src="xlsx.js"></script>
<script src="ui.js"></script>
<!-- Needs BINDER_CONFIG (config.js) and BinderUI (ui.js), both loaded
     above it. tools/check_web.py's run-order arm holds this. -->
<script src="site-content.js"></script>
<script src="session.js"></script>
<!-- After config.js: the revoke reads BINDER_CONFIG.endpoint. See the
     note in your-page.html. -->
<script src="signout.js"></script>
<script src="charts.js"></script>
<script src="nav.js"></script>
<script src="theme.js"></script>
</body>
</html>
