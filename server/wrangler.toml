# Deployment shape, written down so it can be reproduced.
#
# This was documentation-only until 2026-08-05, and it had drifted from
# the live deployment in the two ways a documentation-only file always
# drifts: the `name` was the repository's rather than the Worker's, and
# `database_id` was still the placeholder it shipped with. A
# `wrangler deploy` against that would have created a SECOND Worker
# beside the real one, with a binding that failed on "REPLACE_ME".
#
# It is now real config, which is what stops that happening again -
# a file that gets run is a file that cannot quietly be wrong.
#
# `name` must match the deployed Worker exactly. It is what decides
# whether a deploy updates the existing one or makes a new one, and
# getting it wrong is not an error - it is a success, somewhere else.
#
#     wrangler d1 execute hg_binder_db --remote --file=schema.sql
#     wrangler deploy
#
# Run both from this directory. The first is only needed when
# schema.sql changes; it uses CREATE TABLE IF NOT EXISTS, so re-running
# the whole file against a live database is safe.

name = "hgbinderworker"
main = "worker.js"
compatibility_date = "2026-08-04"

# Off, and not merely unset - wrangler turns these on by default when a
# workers.dev route exists, and says so in a warning that is easy to
# scroll past.
#
# A preview URL publishes every deployed version at its own permanent
# hostname. Nothing leaks through one: the origin check rejects a
# request with no Origin header, and both secrets still gate what they
# gated. What it does leave behind is every past version of this Worker,
# reachable forever, which is a surface that buys nothing here - there
# is no staging branch and no preview environment by design, because a
# push to main is the release. See DESIGN.md, "What is deliberately not
# here".
preview_urls = false

# The site allowed to POST here. Set this and the Worker never needs
# editing - see the comment above DEFAULT_ORIGINS in worker.js.
[vars]
ALLOWED_ORIGINS = "https://potaetoe.github.io"

# Every secret is deliberately absent and must never appear in a file
# that lives in a public repository. The six below belong in the
# dashboard, or in `wrangler secret put` once this config is what
# deploys. DEV_LOGIN_SECRET is a separate, development-only secret and
# must never be set on production.
#
# This comment used to say "Production's six secrets are set in the
# dashboard", and that was a claim nobody had checked. It contradicted
# REDESIGN.md Part 8, which lists setting ACCOUNT_SECRET and
# TELEGRAM_BOT_TOKEN on production as a cutover step, and the only
# recorded setting of ACCOUNT_SECRET was on hgbinderworker-DEV (#33).
#
# No agent can settle which is true: wrangler will not authenticate from
# a non-interactive shell, so the live secret list is owner knowledge.
# CUTOVER.md therefore opens by confirming what exists rather than
# assuming - and ACCOUNT_SECRET is the one where a wrong assumption does
# not come back, because it is permanent once a row carries an id
# derived from it.
#
# Production's hand-pasted script leaves the Worker in version-upload
# state, so `wrangler secret put` tries to create and deploy a version and
# fails with error 10220. Use the dashboard until cutover deploys this
# config; then re-test the CLI rather than assuming it works or remains
# broken.
#
# The three numeric id bindings are secrets even though they are not
# credentials. A [vars] block would publish them in this repository, and
# the allowlist would expose the group membership the account-id design
# exists to hide. A dashboard-only var would be silently erased by the
# next deploy. Secrets supply both properties the ids need: they stay
# private and survive a deploy.
#
#     EXPORT_TOKEN         break-glass admin access
#     TELEGRAM_BOT_TOKEN   verifies every login payload
#     ACCOUNT_SECRET       the HMAC key behind every account id.
#                          PERMANENT - changing it detaches every member
#                          from their own history, with no way back.
#     ADMIN_TELEGRAM_IDS   numeric ids allowed to administer the Worker
#     TELEGRAM_GROUP_CHAT_ID
#                          optional group whose members may sign in
#     ALWAYS_ALLOW_TELEGRAM_IDS
#                          optional ids that bypass the group check
#     DEV_LOGIN_SECRET     DEVELOPMENT ONLY. Its absence is what turns
#                          POST /auth/dev off, so it must never be set
#                          here or on the production Worker.
#
# The id is account-scoped and not a credential - it identifies the
# database but opens nothing without Cloudflare authentication, which is
# why it can sit in a public repository. It is here rather than left as
# a placeholder because a placeholder is what made this file lie: a
# config that gets run cannot quietly be wrong, and a config nobody runs
# is documentation that has stopped being true without telling anyone.
[[d1_databases]]
binding = "DB"            # worker.js reads env.DB - do not rename
database_name = "hg_binder_db"
database_id = "948f3464-e93c-4c8c-b64f-871065c3ee74"

# Local work gets its own Worker, database, origins and secrets. Keep the
# name explicit: a typo here deploys successfully to a new Worker instead
# of failing. preview_urls is repeated rather than inherited by assumption;
# past versions of the development sign-in bypass must not remain reachable.
[env.dev]
name = "hgbinderworker-dev"
preview_urls = false

[env.dev.vars]
ALLOWED_ORIGINS = "http://localhost:8124,http://127.0.0.1:8124"

[[env.dev.d1_databases]]
binding = "DB"            # worker.js reads env.DB - do not rename
database_name = "hg_binder_db_dev"
database_id = "137e266f-a5f1-414f-8fac-3d110b9eb648"
