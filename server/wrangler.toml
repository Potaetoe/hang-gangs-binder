# Deployment shape, written down so it can be reproduced.
#
# This was documentation-only until 2026-08-05, and it had drifted from
# the live deployment in the two ways a documentation-only file always
# drifts: the `name` was the repository's rather than the Worker's, and
# `database_id` was still the placeholder it shipped with. A
# `wrangler deploy` against that would have created a SECOND Worker
# beside the real one, with a binding that failed on "REPLACE_ME".
#
# It is now real config, which is what stops that happening again -
# a file that gets run is a file that cannot quietly be wrong.
#
# `name` must match the deployed Worker exactly. It is what decides
# whether a deploy updates the existing one or makes a new one, and
# getting it wrong is not an error - it is a success, somewhere else.
#
#     wrangler d1 execute hg_binder_db --remote --file=schema.sql
#     wrangler deploy
#
# Run both from this directory. The first is only needed when
# schema.sql changes; CREATE TABLE IF NOT EXISTS makes a rerun safe for
# every table it adds, but the supersedes index is not purely additive
# - every rerun drops it before recreating it unique, which fails
# loudly against two rows that already name the same target and can
# leave NO index behind if it does. OPERATIONS.md, "Before re-running
# schema.sql against a database that already holds rows", carries the
# preflight query, the failure handling and the recovery - read it
# before this command touches a database that is not empty.
# schema.sql's own header carries the same warning where the statement
# itself lives.

name = "hgbinderworker"
main = "worker.js"
compatibility_date = "2026-08-04"

# Off, and not merely unset - wrangler turns these on by default when a
# workers.dev route exists, and says so in a warning that is easy to
# scroll past.
#
# A preview URL publishes every deployed version at its own permanent
# hostname. Nothing leaks through one: the origin check rejects a
# request with no Origin header, and both secrets still gate what they
# gated. What it does leave behind is every past version of this Worker,
# reachable forever, which is a surface that buys nothing here - there
# is no staging branch and no preview environment by design, because a
# push to main is the release. See DESIGN.md, "What is deliberately not
# here".
preview_urls = false

# The site allowed to POST here. Set this and the Worker never needs
# editing - see the comment above DEFAULT_ORIGINS in worker.js.
[vars]
ALLOWED_ORIGINS = "https://potaetoe.github.io"

# Every secret is deliberately absent and must never appear in a file
# that lives in a public repository. DEV_LOGIN_SECRET is a separate,
# development-only secret and must never be set on production.
#
# ALL SIX ARE SET ON PRODUCTION, as Secrets rather than [vars].
# Confirmed by the owner from the dashboard on 2026-08-07, and again on
# 2026-08-08 from an agent shell with
# `wrangler versions view <id> --name hgbinderworker`, which lists secret
# NAMES while their values stay encrypted. Two sources now agree.
# DEV_LOGIN_SECRET is absent there, which is what keeps POST /auth/dev
# off. ALLOWED_ORIGINS above is the one plaintext variable.
#
# The sentence this replaced said it was "the only way it can be
# confirmed, because wrangler will not authenticate from a
# non-interactive shell". That was true when written and is not now: the
# stored OAuth login does work from an agent shell. The first
# authenticated call may fail once with error 10000 while it refreshes
# the token, and the next one succeeds. One failure had been read as a
# capability boundary.
#
# So archive/REDESIGN.md Part 8 step 2 is a confirmation now, not an act, and
# CUTOVER.md says so.
#
# Two notes on how this sentence got here, both worth keeping.
#
# It used to read "Production's six secrets are set in the dashboard"
# with no source. #60 replaced that with a note implying doubt, because
# it contradicted Part 8 and the only recorded setting of ACCOUNT_SECRET
# was on hgbinderworker-DEV (#33). The original was RIGHT. It was
# unverifiable from a session, which is not the same as false, and the
# honest handling of the first is to name who can confirm it - which is
# what this version does and the unsourced one did not.
#
# ACCOUNT_SECRET being set is NOT yet the irreversible moment. It becomes
# permanent when a row carries an id derived from it, and no production
# row does: the table was cleared 2026-08-07 and the live Worker still
# writes no account_id, so anything added since carries NULL. The window
# closes at the first real submission after the cutover deploy.
#
# Production's hand-pasted script leaves the Worker in version-upload
# state, so `wrangler secret put` tries to create and deploy a version and
# fails with error 10220. Use the dashboard until cutover deploys this
# config; then re-test the CLI rather than assuming it works or remains
# broken.
#
# The three numeric id bindings are secrets even though they are not
# credentials. A [vars] block would publish them in this repository, and
# the allowlist would expose the group membership the account-id design
# exists to hide. A dashboard-only var would be silently erased by the
# next deploy. Secrets supply both properties the ids need: they stay
# private and survive a deploy.
#
#     EXPORT_TOKEN         break-glass admin access
#     TELEGRAM_BOT_TOKEN   verifies every login payload
#     ACCOUNT_SECRET       the HMAC key behind every account id.
#                          PERMANENT - changing it detaches every member
#                          from their own history, with no way back.
#     ADMIN_TELEGRAM_IDS   numeric ids allowed to administer the Worker
#     TELEGRAM_GROUP_CHAT_ID
#                          the group whose members may sign in. REQUIRED on
#                          any Worker that signs people in: worker.js's
#                          groupStanding() fails closed without it, admitting
#                          nobody but the break-glass ids below. Present on
#                          production AND [env.sit] alike - sit runs a real
#                          bot against a real (if small) group rather than
#                          doing no Telegram sign-in at all, which is what
#                          the pre-0.9 [env.dev] this replaced did instead
#                          (0.9-M1-S1, #325; #228 Worker-topology addendum).
#     ALWAYS_ALLOW_TELEGRAM_IDS
#                          optional ids that bypass the group check - the
#                          break-glass way in when the check cannot answer
#     DEV_LOGIN_SECRET     DEVELOPMENT ONLY. Its absence is what turns
#                          POST /auth/dev off, so it must never be set
#                          here or on the production Worker.
#
# The id is account-scoped and not a credential - it identifies the
# database but opens nothing without Cloudflare authentication, which is
# why it can sit in a public repository. It is here rather than left as
# a placeholder because a placeholder is what made this file lie: a
# config that gets run cannot quietly be wrong, and a config nobody runs
# is documentation that has stopped being true without telling anyone.
[[d1_databases]]
binding = "DB"            # worker.js reads env.DB - do not rename
database_name = "hg_binder_db"
database_id = "948f3464-e93c-4c8c-b64f-871065c3ee74"

# `sit` is where every non-production act happens against a real bot and
# real persistence, with zero risk to production data - DESIGN.md, "One
# Worker codebase, two environments: sit and production", implemented by
# this block (0.9-M1-S1, #325). It replaces the pre-0.9 [env.dev] block
# this paragraph used to describe. Renaming this block does not touch
# what is actually deployed: `hgbinderworker-dev` and `hg_binder_db_dev`
# stay live under their old names, untouched, until someone deploys this
# shape over them or retires them separately - this slice makes no cloud
# writes at all (its own issue's boundary). Keep the name explicit: a
# typo here deploys successfully to a new Worker instead of failing.
# preview_urls is repeated rather than inherited by assumption, per the
# same reasoning production's own preview_urls line above states.
#
# THE SIT WORKER CARRIES FOUR SECRETS AND MUST NOT CARRY MORE. Unlike
# the pre-0.9 dev arm this replaces, sit runs a REAL bot against a real
# (if small, test-only) Telegram group - #228 Worker-topology addendum,
# 2026-08-13: "Two bots exist by design, split by world... not a
# stand-in but the environment's own bot" - so its roster is closer to
# production's than to dev's:
#
#     ACCOUNT_SECRET          a fresh value, deliberately NOT production's.
#                             DESIGN.md, "The bot is temporary": an id
#                             HMACed under a bot token instead orphans
#                             every row at the first rotation, and sit's
#                             bot is expected to rotate before production's.
#     TELEGRAM_BOT_TOKEN      sit's own bot (#282), permanently - never a
#                             stand-in for production's.
#     TELEGRAM_GROUP_CHAT_ID  the small TEST group's id (#282), never the
#                             real group's.
#     EXPORT_TOKEN            break-glass admin access, carried over from
#                             the pre-0.9 dev arm unchanged. DESIGN.md's
#                             threat model already rules that whoever runs
#                             the Worker can read every entry - "Whoever
#                             runs the Worker", the largest item on that
#                             list - so a break-glass path for that same
#                             operator grants nothing a Cloudflare login
#                             does not already grant.
#
# DELIBERATELY ABSENT, each for its own citation. Do not "fix" the
# asymmetry by setting any of these:
#
#     ADMIN_TELEGRAM_IDS          DESIGN.md, "Admin accounts and
#                                 deletion": "There is no admin list to
#                                 maintain, no founding-admin secret and
#                                 no last-admin guard... every one of
#                                 those mechanisms existed to hold a list
#                                 the site no longer keeps." Until the
#                                 Worker is rewritten to mirror Telegram
#                                 admins live, its absence means no
#                                 account is treated as admin on sit -
#                                 the honest state, not a convenient one.
#     ALWAYS_ALLOW_TELEGRAM_IDS   DESIGN.md, "What is deliberately not
#                                 here": "No always-allow bypass. A list
#                                 that skips the membership check is a
#                                 way in that outlives the reason it was
#                                 added."
#     DEV_LOGIN_SECRET            A judgment call, flagged rather than
#                                 made silently (0.9-M1-S1 completion,
#                                 #325, names it as such): DESIGN.md does
#                                 not name this secret by name, but the
#                                 reason POST /auth/dev existed - that no
#                                 environment here could pass a real
#                                 Telegram sign-in - stops holding the
#                                 moment one has a real bot, and "No
#                                 always-allow bypass" above reads the
#                                 same whether the list has one entry or
#                                 none. Its absence turns POST /auth/dev
#                                 off here exactly as it does on
#                                 production; see the general secret list
#                                 above.
#
# server/worker.js is untouched by this rename (out of this slice's
# scope; #325's own boundary). Concretely, that means: with only the
# four secrets above set, groupStanding() can genuinely check the real
# test group (unlike the old dev arm, which always fell through its
# missing-bot-token guard), but adminAccountIds() still reads only
# ADMIN_TELEGRAM_IDS, which is empty here on purpose - so no account
# reads as admin on sit until the Worker is rewritten to mirror Telegram
# admins live. That gap is real and is flagged in this slice's
# completion rather than papered over with a secret DESIGN.md just ruled
# out.
[env.sit]
name = "hgbinderworker-sit"
preview_urls = false

# Loopback only, matching the pre-0.9 dev arm's shape - OPERATIONS.md,
# "Checking a deployment", is the one place that names an origin for
# sit by name ("the localhost origin on sit"), and this is it. sit's
# own workers.dev origin is deliberately NOT added here yet: the Worker
# this config deploys does not yet serve the static site from its own
# origin (DESIGN.md, "The constraint that shapes everything", is the
# change that eventually makes it need to), so nothing here needs to
# POST back to itself. Adding it is a one-line change when that lands -
# but that same change also has to re-examine tools/check_live.py's
# "published-origin-only" and "guarded-branch" ledger rows, whose
# classifications assume this arm never carries a bot token or a
# published origin; this slice's roster above already breaks the first
# half of that assumption, and the ledger has not been told (0.9-M1-S1
# completion, #325, names this finding for whichever slice picks it up).
[env.sit.vars]
ALLOWED_ORIGINS = "http://localhost:8124,http://127.0.0.1:8124"

# The database exists since 2026-08-18: OPERATIONS.md's "Building the
# sit environment" step 1 was run (owner-initiated, #282) and
# `wrangler d1 create hg_binder_db_sit` printed the id below. The id is
# account-scoped and not a credential, for the same reasons written
# above production's own [[d1_databases]] block - it identifies the
# database but opens nothing without Cloudflare authentication. The
# absence this block replaced used to be what kept the file honest;
# now presence is: a config that gets run cannot quietly be wrong, and
# this one names a database that really answers to this id
# (0.9-M1-S1b landed it the same hour the id was minted).

[[env.sit.d1_databases]]
binding = "DB"            # worker.js reads env.DB - do not rename
database_name = "hg_binder_db_sit"
database_id = "05fc23ae-e0a1-4ca4-8f18-fd6425525853"
