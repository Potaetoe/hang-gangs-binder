name: Verify

# Runs the gates. Nothing here deploys.
#
# ---------------------------------------------------------------------
# WHAT MERGING TO MAIN MEANS NOW
#
# It means the gates below ran and passed. It does not publish anything.
# There is no deploy job in this file and no site behind one: the GitHub
# Pages deployment was taken down by owner order on 2026-08-13 - the
# amendment to the hosting addendum on #228, which moved the Pages
# retirement up from 1.0 to now - and 0.9-M0-S6 removed the job that fed
# it. The Pages configuration is deleted at the repository as well, so
# re-adding a job here would not by itself put the old release path back.
#
# The deploy that replaces it is not written, and it does not belong in
# this file until it is. Live becomes ONE Cloudflare Worker serving the
# static site and the API from a single origin - one `wrangler deploy`,
# no second host to hold in step. M1 builds that shape; 1.0 makes it the
# release. Whoever writes it adds the job here. Until then a green run
# means checked, not shipped, and that is the whole of what it means.
#
# The Worker in server/ is deployed separately and by hand, which is why
# the repository and the live endpoint can disagree. That was already
# true of this file and is not what changed. See server/README.md.
# ---------------------------------------------------------------------

# The checks run on pull requests as well as on main. Until two agents
# started working here a push *was* the review, so gating only main was
# enough; under branch-and-review it would mean every check ran after the
# merge, which is the wrong way round.
#
# `accounts` is listed in both lists deliberately. Leaving it out of
# `pull_request` would mean a step merged into it with no checks at all,
# which is the failure this trigger list was widened to fix in the first
# place; leaving it out of `push` would mean the accumulated branch went
# unverified between steps, and it is what main eventually becomes.
on:
  push:
    branches: [main, accounts]
  pull_request:
    branches: [main, accounts]
  workflow_dispatch:

# Read-only, and nothing here needs more. The two write scopes that
# a Pages release took - one over Pages itself, one to mint an id token
# - were granted to the deploy job alone and went with it. They are not
# spelled out here on purpose: a scope written in a comment is a scope
# the next grep finds in this file. A workflow that can only read cannot
# publish whatever any step in it does, and that is the state this file
# stays in until the Worker deploy is written against a token of its own.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 22 rather than 20 because the gate's strongest membership arms
      # execute the delete guard's SQL through `node:sqlite`, which
      # arrived after 20. On 20 they self-skip loudly and the run counts
      # six checks fewer - honest, and still a runner that never asks an
      # engine anything, so the one mutation class nothing else in the
      # gate catches went uncaught here.
      #
      # THE MAJOR IS THE FLOOR, NOT THE WHOLE CONDITION: the module needs
      # --experimental-sqlite until 22.13.0 and runs unflagged from
      # there. A bare '22' takes the newest 22.x, which is far past that,
      # so this is safe - but pinning a patch below 22.13 would put the
      # six arms straight back into the silence this pin removes.
      #
      # This pin's proof cannot exist before it runs: it is this
      # workflow's own verify log reading `worker.js OK - 365 checks`
      # rather than 359, with no "node:sqlite is absent" note above it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --ignore-scripts is not decoration. Linting brought 87 transitive
      # packages into a repository whose design rejected libsodium.js -
      # a better crypto primitive than the one written here - because it
      # was third-party code near the plaintext. Without this flag every
      # one of those packages may run arbitrary code at install time, in
      # the job that decides whether a release is allowed.
      #
      # The realistic attack is not a compromised site: this job holds
      # `contents: read` and cannot publish. It is a compromised
      # dependency quietly neutering ESLint so the gate reports success
      # on a repository that should fail - a check that looks armed and
      # is not, which is the failure this project has twice called worse
      # than having no check at all.
      #
      # Verified rather than assumed: `npm ci --ignore-scripts` installs
      # all 87 packages and ESLint runs clean. Nothing here needs a
      # native build.
      # fonttools is the gate's only route into a woff2: the tables are
      # Brotli compressed, so tools/check_fonts.py cannot read a subset
      # face's cmap without it, and that stage is written to FAIL rather
      # than skip when it is missing - a coverage check that goes green
      # because it could not open the font is the armed-looking-but-not
      # failure this repository holds to be worse than no check.
      #
      # Pinned, per the field note about npx resolving two different
      # majors minutes apart. Here it buys a second thing: the committed
      # subset was produced by this exact version, and a subsetter that
      # drifts from the one that wrote the binary is a gate disagreeing
      # with the artifact it guards for reasons nobody would look for.
      #
      # It is gate tooling and never reaches the site. pyproject.toml
      # says why that distinction holds, in its own words: "Nothing
      # under tools/ reaches the published site - only dist/ ships,
      # and tools/ sits beside it as a sibling directory that never
      # gets copied." Same standing as ruff and eslint, not anywhere
      # near plaintext.
      # (The deploy job that once copied dist/ is gone as of
      # 0.9-M0-S6, #286 - this job now also holds `contents: read`
      # and cannot publish at all, which is the same standing by a
      # stronger route; the citation above is pyproject.toml's own
      # words, unedited, not this job's reason.)
      - name: Install the gate's tooling
        run: |
          npm ci --ignore-scripts
          python -m pip install --quiet ruff "fonttools[woff]==4.63.0"

      # One step, one registry. tools/check.py is the only suite list
      # (owner decision, 2026-08-08): registering a check there is
      # registering it in the pipeline too, because this step runs the
      # whole gate and fails if any stage does. The stage-by-stage
      # account - names, order, and each check's reason - is the table
      # this step prints and the docstring of every suite it runs;
      # enumerating the stages here as well was the two-lists tax, and
      # drift between the lists was a standing hazard this shape cannot
      # have. What the Actions page loses in per-stage step names, this
      # step's log carries in full.
      - name: Run the whole gate
        run: python tools/check.py

      # TWO GATES, BOTH BLOCKING, AND THE STEP NAME SAYS WHICH WORLD.
      #
      # The step above is the pre-0.9 gate. It guards the surfaces that
      # still exist and shrinks as each rebuild slice retires its arms
      # with its surface; this one is 0.9's, built new under the owner
      # ruling on #228, and grows the other way. Both fail the verify
      # job itself, and nothing in this file can publish past it -
      # there is no deploy job left to gate at all. Neither can be
      # read as covering for the other: they check different trees,
      # and for the length of the transition a release has to satisfy
      # both worlds.
      #
      # `if` rather than nothing, and this is the reason: a step with no
      # condition is skipped once an earlier step fails, so a red in the
      # old gate would hide the state of the new one and a fix would
      # take two round trips to learn about the second failure. This way
      # one run reports both. It does NOT weaken the gate - a step that
      # runs after a failure cannot un-fail the job - and it is not
      # `always()`, because a cancelled run should stop rather than
      # carry on doing work nobody is waiting for.
      #
      # No install line above it because there is nothing to install.
      # The arms and tests/run.mjs import node: builtins and nothing
      # else, which is the same reason the runner has no framework under
      # it; the node the setup-node step already pinned is the whole
      # dependency. If that ever stops being true it belongs in the
      # existing install step, not in a second one here.
      #
      # tests/run.mjs discovers its own arms, so this step never lists
      # them - registering an arm is adding the file. That is the half
      # of `python tools/check.py` above worth keeping: one step, one
      # registry, and no second list here to drift from the first.
      - name: Run the 0.9 gate
        if: ${{ !cancelled() }}
        run: node tests/run.mjs
