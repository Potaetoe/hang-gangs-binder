name: Verify and deploy

# Publishes dist/ to GitHub Pages, but only after the checks pass.
#
# ---------------------------------------------------------------------
# THE BUILD IS STILL A COPY, AND THAT IS THE POINT
#
# dist/ contains exactly what gets published - nothing more. It is
# apps/web with the comments taken out of the CSS and the scripts (#181),
# written by tools/build_web.mjs and COMMITTED, so this job copies a
# reviewed directory rather than producing one. Checks, the key generator
# and the test harness live in tools/ and dev/, which are sibling
# directories the deploy never looks at.
#
# The generation deliberately does not happen here. A step that builds
# during the release is a step whose output nobody has read, and the
# thing that must never be published is the private key that every
# submitter's privacy depends on. Generating in a commit means what ships
# is in a diff; the verify job's `dist is the build of apps/web` stage
# then refuses a dist/ that has come apart from its source in either
# direction, and tools/check_web.py fails the build if anything
# key-shaped is sitting in either tree.
#
# A push to main is a release. What protects production is this job, plus
# running the site locally before pushing. A non-production *environment*
# - a second Worker and D1, with config.js choosing by hostname - is a
# different thing and exists; see DESIGN.md.
#
# `accounts` is an integration branch, added 2026-08-05, and it is the one
# exception to "a branch is not a release" being the whole story. It is
# not a staging environment and does not deploy: it exists because the
# accounts redesign is a chain of ten steps whose intermediate states are
# broken on purpose - a sign-in page before the widget exists refuses
# everybody - and main must never hold one of them. Steps land there,
# main stays at the last complete release, and the two meet once.
#
# This job never deploys server/. The Worker is deployed separately and
# by hand, which means the repository and the endpoint can disagree -
# and as of 2026-08-05 they deliberately do. See server/README.md.
# ---------------------------------------------------------------------

# The checks run on pull requests as well as on main. Until two agents
# started working here a push *was* the review, so gating only main was
# enough; under branch-and-review it would mean every check ran after the
# merge, which is the wrong way round. The deploy job stays main-only -
# see its `if` below.
#
# `accounts` is listed in both lists deliberately. Leaving it out of
# `pull_request` would mean a step merged into it with no checks at all,
# which is the failure this trigger list was widened to fix in the first
# place; leaving it out of `push` would mean the accumulated branch went
# unverified between steps, and it is what main eventually becomes.
on:
  push:
    branches: [main, accounts]
  pull_request:
    branches: [main, accounts]
  workflow_dispatch:

# Read-only by default. The two write scopes a Pages release needs are
# granted to the deploy job alone, so a pull request from a branch cannot
# reach them even if something in the verify job goes wrong.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 22 rather than 20 because the gate's strongest membership arms
      # execute the delete guard's SQL through `node:sqlite`, which
      # arrived after 20. On 20 they self-skip loudly and the run counts
      # six checks fewer - honest, and still a runner that never asks an
      # engine anything, so the one mutation class nothing else in the
      # gate catches went uncaught here.
      #
      # THE MAJOR IS THE FLOOR, NOT THE WHOLE CONDITION: the module needs
      # --experimental-sqlite until 22.13.0 and runs unflagged from
      # there. A bare '22' takes the newest 22.x, which is far past that,
      # so this is safe - but pinning a patch below 22.13 would put the
      # six arms straight back into the silence this pin removes.
      #
      # This pin's proof cannot exist before it runs: it is this
      # workflow's own verify log reading `worker.js OK - 365 checks`
      # rather than 359, with no "node:sqlite is absent" note above it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --ignore-scripts is not decoration. Linting brought 87 transitive
      # packages into a repository whose design rejected libsodium.js -
      # a better crypto primitive than the one written here - because it
      # was third-party code near the plaintext. Without this flag every
      # one of those packages may run arbitrary code at install time, in
      # the job that decides whether a release is allowed.
      #
      # The realistic attack is not a compromised site: this job holds
      # `contents: read` and cannot publish. It is a compromised
      # dependency quietly neutering ESLint so the gate reports success
      # on a repository that should fail - a check that looks armed and
      # is not, which is the failure this project has twice called worse
      # than having no check at all.
      #
      # Verified rather than assumed: `npm ci --ignore-scripts` installs
      # all 87 packages and ESLint runs clean. Nothing here needs a
      # native build.
      # fonttools is the gate's only route into a woff2: the tables are
      # Brotli compressed, so tools/check_fonts.py cannot read a subset
      # face's cmap without it, and that stage is written to FAIL rather
      # than skip when it is missing - a coverage check that goes green
      # because it could not open the font is the armed-looking-but-not
      # failure this repository holds to be worse than no check.
      #
      # Pinned, per the field note about npx resolving two different
      # majors minutes apart. Here it buys a second thing: the committed
      # subset was produced by this exact version, and a subsetter that
      # drifts from the one that wrote the binary is a gate disagreeing
      # with the artifact it guards for reasons nobody would look for.
      #
      # It is gate tooling and never reaches the site. pyproject.toml
      # says why that distinction holds: the deploy job copies dist/ and
      # never looks at a sibling directory, so this sits in the same
      # standing as ruff and eslint rather than anywhere near plaintext.
      - name: Install the gate's tooling
        run: |
          npm ci --ignore-scripts
          python -m pip install --quiet ruff "fonttools[woff]==4.63.0"

      # One step, one registry. tools/check.py is the only suite list
      # (owner decision, 2026-08-08): registering a check there is
      # registering it in the pipeline too, because this step runs the
      # whole gate and fails if any stage does. The stage-by-stage
      # account - names, order, and each check's reason - is the table
      # this step prints and the docstring of every suite it runs;
      # enumerating the stages here as well was the two-lists tax, and
      # drift between the lists was a standing hazard this shape cannot
      # have. What the Actions page loses in per-stage step names, this
      # step's log carries in full.
      - name: Run the whole gate
        run: python tools/check.py

  deploy:
    needs: verify
    # A pull request gets the checks and nothing else. Publishing is what
    # merging to main is for, and a release triggered from a branch would
    # make the site something other than what main says it is.
    #
    # The ref test is the load-bearing half and it is not redundant. This
    # condition was `event_name != 'pull_request'` alone, which was
    # sufficient only while main was the single branch in the `push`
    # trigger list; the moment `accounts` was added there, a push to it
    # would have satisfied that test and published a half-built redesign
    # to the live site. A branch that deploys because of what it is NOT
    # is one trigger-list edit away from deploying. Name the branch that
    # releases.
    #
    # github.ref on a pull_request event is refs/pull/<n>/merge, so the
    # ref test already excludes pull requests; the event test is kept
    # because two conditions that each fail closed is the pattern this
    # repository uses wherever the cost of being wrong is a release.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Let an in-flight deploy finish rather than cancelling it midway.
    # Job-level rather than workflow-level, so pull-request checks do not
    # queue behind a release they are not going to perform.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build the site
        # Still a copy. dist/ is the product and it is committed, so
        # there is nothing to strip here and nothing to guard against
        # having failed to strip - the generation happened in a commit a
        # reviewer read, and the verify job above refuses a dist/ that is
        # not what apps/web builds to. See the header of this file.
        run: |
          rm -rf _site
          cp -r dist _site
          echo "publishing ($(du -sh _site | cut -f1)):"
          ls -R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
