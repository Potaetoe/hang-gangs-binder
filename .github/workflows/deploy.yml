name: Verify and deploy

# Publishes apps/web to GitHub Pages, but only after the checks pass.
#
# ---------------------------------------------------------------------
# THE BUILD IS A COPY
#
# apps/web contains exactly what gets published - nothing more. Checks,
# the key generator and the test harness live in tools/ and dev/, which
# are sibling directories the deploy never looks at.
#
# This matters more here than it did in the project this pattern came
# from. There, a strip step going wrong would have published a test
# fixture. Here, the thing that must never be published is the private
# key that every submitter's privacy depends on, and a deletion that
# never happens cannot fail to happen. tools/check_web.py additionally
# fails the build if anything key-shaped is sitting in apps/web.
#
# There is deliberately no staging branch: a push is a release. What
# protects production is this job, plus running the site locally before
# pushing. A non-production *environment* - a second Worker and D1, with
# config.js choosing by hostname - is a different thing and is planned;
# see DESIGN.md, "What is deliberately not here".
#
# This job never deploys server/. The Worker is deployed separately and
# by hand, which means the repository and the endpoint can disagree -
# and as of 2026-08-05 they deliberately do. See server/README.md.
# ---------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check apps/web is publishable
        run: python tools/check_web.py

      # The one check whose failure is about the data rather than the
      # site. A crypto.js that no longer reads what is already stored
      # publishes a site that looks perfect and cannot be exported from,
      # so this blocks the release rather than being noticed later.
      - name: Check the encryption round-trips
        run: node dev/crypto.test.mjs

      # The other half of the same failure. crypto.js proves the bytes
      # survive; this proves the numbers going into them are the ones
      # the submitter typed. A wrong conversion factor produces a
      # plausible record, seals it perfectly, and is undiscoverable
      # after the fact - there is no original to compare against.
      - name: Check the form's conversions and validation
        run: node dev/form.test.mjs

      # The CSV is what the whole project is for. A quoting bug does not
      # throw - it shifts one column into the next and produces a file
      # that opens cleanly and is wrong.
      - name: Check the export's CSV
        run: node dev/admin.test.mjs

      # An .xlsx is a ZIP of XML written by hand here, because the page
      # that builds it may not load a library. Its failure is not a
      # wrong number - it is a file that will not open at all, and the
      # message the keyholder gets says only that it is corrupt.
      - name: Check the spreadsheet
        run: node dev/xlsx.test.mjs

      # A median over the wrong rows, or a person counted once per
      # submission, produces a chart that is wrong and looks right.
      - name: Check the dashboard's arithmetic
        run: node dev/dashboard.test.mjs

      - name: Check the Worker
        # server/ is not published by this job, but a release that leaves
        # the endpoint broken is still a broken release. Since the
        # accounts work this also gates sign-in, the session rules and
        # the route-by-caller matrix - including that the development
        # login route stays shut, which is the one failure here that
        # would be a real compromise rather than an outage.
        run: node dev/worker.test.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build the site
        # A copy. apps/web is the product, so there is nothing to strip
        # and nothing to guard against having failed to strip.
        run: |
          rm -rf _site
          cp -r apps/web _site
          echo "publishing ($(du -sh _site | cut -f1)):"
          ls -R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
