name: CI

on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hook selftest
        run: python3 hooks/selftest.py
      - name: Lint
        run: npm run lint
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Feature-loop tests
        run: |
          cp .dev.vars.example .dev.vars
          npx playwright install --with-deps chromium
          npx playwright test
